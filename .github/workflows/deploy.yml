name: Deploy to GitHub Pages

on:
  push:
    branches: [main, publish-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify committed public data
        run: node scripts/verify-public-data.mjs
      - name: Install, build, verify, and upload site
        uses: withastro/action@v6
        with:
          node-version: '22.23.4'
          build-cmd: npm run build && node scripts/verify-public-data.mjs --dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
