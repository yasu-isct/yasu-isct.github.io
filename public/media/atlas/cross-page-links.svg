<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="cross-title cross-desc">
  <title id="cross-title">ページをまたいでも、関係は続く。</title>
  <desc id="cross-desc">自作の架空資料です。全体の規則、条件と例外、参照図と注の三ページを、適用・補足・参照の関係で方向を示してつないでいます。</desc>
