<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="figure-svg-title figure-svg-desc">
  <title id="figure-svg-title">画像・図題・本文を、同じ対象へ。</title>
  <desc id="figure-svg-desc">自作の幾何図と架空の文書を使い、画像領域、図題、本文中の参照を対応付けています。画像認識モデルの実出力や実験結果ではありません。</desc>
