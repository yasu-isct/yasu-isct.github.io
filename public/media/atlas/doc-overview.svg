    <circle cx="574" cy="498" r="5" fill="#2166b5" stroke="none"/>
    <circle cx="553" cy="653" r="5" fill="#2166b5" stroke="none"/>
    <path d="M795 225L804 232L795 239M795 491L804 498L795 505M795 648L804 655L795 662"/>
  </g>
  <g id="overview-figure-node">
    <text x="828" y="197" class="ov-mono ov-label">01 / FIGURE</text>
    <text x="828" y="240" font-size="30" font-weight="600" class="ov-ink">何を描いた図か。</text>
    <text x="828" y="280" font-size="19" class="ov-label">画像領域・図題・本文参照</text>
    <path d="M828 306H1146" class="ov-rule"/>
  </g>
  <g id="overview-table-node">
    <text x="828" y="443" class="ov-mono ov-label">02 / TABLE</text>
    <text x="828" y="486" font-size="30" font-weight="600" class="ov-ink">どの値の、見出しか。</text>
    <text x="828" y="528" font-size="19" class="ov-label">多段表頭・結合セル・脚注</text>
    <path d="M828 554H1146" class="ov-rule"/>
  </g>
  <g id="overview-link-node">
    <text x="828" y="616" class="ov-mono ov-label">03 / CROSS-PAGE</text>
    <text x="828" y="659" font-size="30" font-weight="600" class="ov-ink">別のページへ、続く。</text>
    <text x="828" y="700" font-size="19" class="ov-label">条件・例外・根拠のつながり</text>
  </g>
  <text x="54" y="760" font-size="17" fill="#595951">自作の模式図。実在資料・モデルの推論・研究結果を示すものではありません。</text>
</svg>
